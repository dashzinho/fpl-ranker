<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Rankings</title>
<style>
:root{
  --bg:#0b0b1a; --bg2:#10102a; --panel:#15152f; --panel2:#1c1c3b; --line:#272750; --text:#ecebff; --muted:#9a98c4;
  --accent:#00ff87; --accent-ink:#06250f; --violet:#b06cff; --gold:#ffd24a; --green:#2bd48e; --red:#ff5d73; --amber:#ffb454; --blue:#4da3ff;
  --shadow:0 10px 30px rgba(0,0,0,.35); --r:16px;
  --d1:#23c97f; --d2:#86d96a; --d3:#e8cd4a; --d4:#ff9a4d; --d5:#ff5d73; --dtxt:#0b1220;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f1f0fb; --bg2:#e9e8f7; --panel:#ffffff; --panel2:#f5f4fd; --line:#dedcf2; --text:#1d1646; --muted:#675f98;
    --accent:#0aa35c; --accent-ink:#fff; --violet:#7a3fe0; --gold:#b98600; --green:#0f9d6e; --red:#d62f4f; --amber:#c87500; --blue:#1d6fd6;
    --shadow:0 8px 24px rgba(40,30,110,.10);
  }
}
:root[data-theme="light"]{
  --bg:#f1f0fb; --bg2:#e9e8f7; --panel:#ffffff; --panel2:#f5f4fd; --line:#dedcf2; --text:#1d1646; --muted:#675f98;
  --accent:#0aa35c; --accent-ink:#fff; --violet:#7a3fe0; --gold:#b98600; --green:#0f9d6e; --red:#d62f4f; --amber:#c87500; --blue:#1d6fd6;
  --shadow:0 8px 24px rgba(40,30,110,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 520px at 85% -10%, color-mix(in srgb,var(--violet) 18%,transparent), transparent 60%),var(--bg);
  color:var(--text);font-family:Inter,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:14px;line-height:1.4;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#6a2cff);display:grid;place-items:center;font-weight:900;color:#0b0b1a;font-size:13px}
.brand h1{font-size:16px;margin:0;font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 12px;min-width:92px}
.stat b{display:block;font-size:15px}
.stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.themebtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.wrap{max-width:1500px;margin:0 auto;padding:18px 24px 50px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-title{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 12px;font-weight:800}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.good{color:var(--green)}.tag.bad{color:var(--red)}.tag.warn{color:var(--amber)}.tag.vio{color:var(--violet)}
.d-up{color:var(--green)}.d-dn{color:var(--red)}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;padding:16px 18px;align-items:flex-end;margin-bottom:14px}
.c{min-width:150px}
.c label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;gap:10px}
.c label b{color:var(--text)}
.c input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=search]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:6px 0;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.posbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-weight:700;font-size:13px;color:var(--muted)}
.pill.on{background:var(--violet);border-color:var(--violet);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:relative;text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
th.on{color:var(--accent)}
td{padding:9px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--violet) 8%,transparent)}
tr.xrow td{background:var(--panel2);padding:16px}
.rk{color:var(--muted);font-weight:800;width:34px}
.pn{font-weight:800}
.tm{display:inline-block;min-width:34px;text-align:center;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin-right:6px}
.scorebar{display:flex;align-items:center;gap:8px;min-width:110px}
.scorebar i{display:block;height:7px;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--accent))}
.scorebar b{min-width:30px;text-align:right}
.strip{display:flex;gap:3px;flex-wrap:nowrap}
.fc{display:flex;flex-direction:column;gap:2px}
.fx{min-width:42px;text-align:center;font-size:10.5px;font-weight:800;padding:4px 3px;border-radius:6px;color:var(--dtxt);line-height:1.1}
.fx small{display:block;font-weight:600;opacity:.8;font-size:9px}
.fx.d1{background:var(--d1)}.fx.d2{background:var(--d2)}.fx.d3{background:var(--d3)}.fx.d4{background:var(--d4)}.fx.d5{background:var(--d5)}
.fx.blank{background:var(--panel2);color:var(--muted);border:1px dashed var(--line)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.ovc{padding:16px}
.ovr{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.ovr:last-child{border-bottom:0}
.ovr .strip{grid-column:2 / -1}
.big{font-size:20px;font-weight:900}
.xgrid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1.3fr) minmax(220px,.9fr);gap:22px}
@media (max-width:1000px){.xgrid{grid-template-columns:1fr}}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:8px 0 10px}
.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c);vertical-align:-1px}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px}
.spark i{display:block;width:14px;border-radius:3px 3px 0 0;background:var(--violet);min-height:2px;position:relative}
.spark i.z{background:var(--line)}
.mini th,.mini td{padding:5px 6px;font-size:12px;cursor:default}
.note{color:var(--muted);font-size:12px;margin:10px 4px 0}
#controls .chk{justify-content:flex-start}
.controls{padding:10px 18px!important;margin-bottom:10px!important}.pitch .prow{margin:2px 0 8px}.pitch{padding:8px 6px 2px}
.subhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 12px}.subnav button{padding:7px 14px}
.mstats .chips{margin:0;align-self:center}.mstats{align-items:stretch}
.controls .chks{display:flex;flex-direction:row;gap:6px 18px;flex-wrap:wrap;align-items:center;min-width:0}
.pitch{padding:10px 6px 4px}.prow{margin:4px 0 12px}.pcard{width:96px;padding:3px 3px 4px}.pcard .fx{min-width:64px}.pnm{font-size:12px;max-width:90px}
.benchbar{margin-top:8px;padding:20px 8px 8px}.bslot{margin-top:6px}
details.note>summary{cursor:pointer;color:var(--muted);margin-bottom:6px}
.homegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.homegrid .span2{grid-column:span 2}
@media(max-width:1000px){.homegrid{grid-template-columns:1fr 1fr}}@media(max-width:640px){.homegrid{grid-template-columns:1fr}.homegrid .span2{grid-column:auto}}
.bignum{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.ratingrow{display:flex;gap:14px;align-items:center}.rating{flex:none;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font:800 26px sans-serif;border:5px solid var(--line)}
.rating.g{border-color:var(--green);color:var(--green)}.rating.o{border-color:var(--amber);color:var(--amber)}.rating.r{border-color:var(--red);color:var(--red)}
a.nl{margin-left:auto;font-size:11.5px;color:var(--muted);text-decoration:none;font-weight:600}a.nl:hover{color:var(--accent)}
.tkbar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}.tkbar label{display:flex;gap:6px;align-items:center}
.cmpbest{color:var(--green);font-weight:800}
.plgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}@media(max-width:1100px){.plgrid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.plgrid{grid-template-columns:1fr}}
.plc{padding:12px 14px!important}.plc.bad{border-color:var(--red)}.plh{display:flex;gap:8px;align-items:center;margin-bottom:6px}.plh select{margin-left:auto;width:auto;padding:4px 8px;font-size:12px}
.pladd{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pladd select{padding:5px 8px;font-size:12px;flex:1;min-width:120px}
.lah{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;font-weight:700}.lah select{width:auto;padding:6px 8px}
.homegrid .span3{grid-column:1/-1}.cols2{columns:2;column-gap:28px}.cols2 .nline{break-inside:avoid}@media(max-width:800px){.cols2{columns:1}}
.btbar{display:inline-block;width:110px;height:8px;border-radius:4px;background:var(--panel2);vertical-align:middle;margin-right:6px;overflow:hidden}.btbar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--accent))}
.wchips{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:5px}.wchips small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:2px}
.wchip{display:inline-flex;align-items:baseline;gap:4px;font-size:11px;line-height:1.5;padding:1px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}.wchip b{display:inline;color:var(--text);font-weight:700}.wchip.sc{border-color:color-mix(in srgb,var(--violet) 50%,var(--line))}
.wsnow{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--accent) 7%,var(--panel2));margin:6px 0 4px}
.wsranks{display:flex;flex-wrap:wrap;gap:6px}.wsr{min-width:84px;text-align:center;padding:5px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}.wsr.on{border-color:var(--accent)}.wsr small{display:block;font-size:10px;color:var(--muted)}.wsr b{font-size:15px}
table.ws td,table.ws th{vertical-align:middle}table.ws tr.sec td{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:16px;border-bottom:1px solid var(--line)}
table.ws .rkc{font-size:16px;font-weight:800;white-space:nowrap}table.ws .big{font-size:15px;font-weight:700}
#tipbox{position:fixed;z-index:200;display:none;max-width:320px;padding:9px 12px;border-radius:10px;background:#07071a;color:#ecebff;border:1px solid var(--violet);box-shadow:0 10px 30px rgba(0,0,0,.45);font:12.5px/1.45 Inter,"Segoe UI",system-ui,sans-serif;pointer-events:none}
[data-tip]{cursor:help}
.info{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:5px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font:700 10px/1 sans-serif;font-style:normal;vertical-align:1px}
.info:hover,.info:focus{color:var(--accent);border-color:var(--accent);outline:0}
.pcard.new{border-color:var(--accent)}.pcard.out{opacity:.45}
.nb{position:absolute;top:-8px;left:-6px;z-index:2;font:800 9px/1 sans-serif;font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:3px 5px}
.pflags{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:2px;margin-top:2px}.pflags .tag{font-size:10px;padding:1px 6px}
.yc{display:inline-block;width:7px;height:10px;background:#ffd24a;border-radius:1.5px;margin-right:4px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.mvline{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}.mvline:last-child{border-bottom:0}
.psum{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px}.warnline{color:var(--amber);font-size:12px;margin-top:6px}
button.plan{background:var(--violet);color:#fff;border:0;border-radius:8px;padding:4px 10px;font-weight:800;font-size:12px}button.plan.on{background:var(--accent);color:var(--accent-ink)}
button.x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:14px}button.x:hover{color:var(--red)}
tr.cur td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.syncbtn{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:800;text-decoration:none;cursor:grab}
.nline{padding:10px 2px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}.nline:last-child{border-bottom:0}.nline a,.note a{color:var(--text);font-weight:700;text-decoration:none}.nline a:hover,.note a:hover{color:var(--accent);text-decoration:underline}
.nmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.mstats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{display:inline-flex;flex-direction:column;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:12px;line-height:1.2}
.chip small{font-weight:600;font-size:10.5px;color:var(--muted)}
.chip.avail{border-color:var(--accent);color:var(--accent)}.chip.used{opacity:.55;text-decoration:line-through}.chip.used small{text-decoration:none}
.chipnote{font-size:11.5px}.muted{color:var(--muted)}
.mygrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){.mygrid{grid-template-columns:1fr}}
.pitch{position:relative;border-radius:var(--r);padding:14px 8px 10px;background:repeating-linear-gradient(180deg,#2f9e5c 0 58px,#2a9054 58px 116px);border:1px solid #1f7a45;box-shadow:var(--shadow);overflow:hidden}
.pitch::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,255,255,.28)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border:2px solid rgba(255,255,255,.28);border-radius:50%}
.prow{position:relative;z-index:1;display:flex;justify-content:space-around;gap:6px;margin:6px 0 16px}
.pcard{position:relative;width:104px;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(255,255,255,.93);color:#16163a;border:2px solid transparent;border-radius:12px;padding:4px 4px 5px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.pcard:hover{transform:translateY(-2px)}.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}
.pcard .shirt{line-height:0;margin-top:-18px}
.pnm{font-size:12.5px;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .strip{justify-content:center}.pcard .fx{min-width:70px}
.pxp{font-size:10.5px;color:#4a4a78;font-weight:700}
.cb{position:absolute;top:-8px;right:-6px;z-index:2;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1a1200;font:800 11px/20px sans-serif;text-align:center;font-style:normal;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.cb.vc{background:#cfd3e8}
.benchbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center;margin-top:10px;padding:22px 10px 10px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);position:relative}
.benchbar .bl{position:absolute;left:12px;top:6px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.bslot{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:10px}.bslot small{color:var(--muted);font-weight:800;font-size:10.5px}
.mside{display:flex;flex-direction:column;gap:14px}.mside .section{padding:14px 16px}
.selhd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
table.mt{margin-top:8px}.mfx{margin-top:4px}.mfx .fx{min-width:50px}
.mv{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px}
.mv:hover{background:color-mix(in srgb,var(--violet) 8%,transparent)}.mv .num{margin-left:auto;font-weight:800}.mv .arr{color:var(--muted)}
.hbars{display:flex;gap:6px;align-items:flex-end;height:120px}
.hb{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:10.5px}
.hb i{display:block;width:100%;max-width:26px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--accent),var(--violet))}
.hb small{color:var(--muted)}.hb em{position:absolute;top:-4px;font-style:normal;font-size:9px;font-weight:800;background:var(--gold);color:#1a1200;border-radius:5px;padding:0 3px}
.empty{padding:36px;text-align:center;color:var(--muted)}
.section{padding:18px}
.tcell{min-width:46px}
.rankchg{font-weight:800}
.sqline{display:grid;grid-template-columns:40px 1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.sqline:last-child{border-bottom:0}
.hide{display:none !important}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:0 0 30px}
.more{display:block;margin:12px auto 0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 20px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">FPL</div><div><h1>FPL Rankings</h1><p id="sub"></p></div></div>
  <div class="seg" id="tabs"><button data-t="home">Home</button><button data-t="my">My team</button><button data-t="rk">Rankings</button><button data-t="tm">Fixtures</button><button data-t="cmp">Compare</button><button data-t="wt">Watch</button><button data-t="nw">News</button><button data-t="sq">Best squad</button><button data-t="md">Model</button></div>
  <label class="lah hide" id="lah">Look-ahead <select id="hsel"></select></label>
  <div class="stats" id="stats"></div>
  <button class="themebtn" id="theme" aria-label="Toggle theme">◐</button>
</header>
<div class="wrap">
  <div class="card controls" id="controls">
    
    <div class="c w-only"><label><span id="tl-wo">Weight: outlook (xPts)</span> <b id="v-wo" class="num"></b></label><input type="range" id="wo" min="0" max="100" step="5"></div>
    <div class="c w-only"><label><span id="tl-wp">Weight: season performance</span> <b id="v-wp" class="num"></b></label><input type="range" id="wp" min="0" max="100" step="5"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const POS = {1: 'GKP', 2: 'DEF', 3: 'MID', 4: 'FWD'};
const TEAM = Object.fromEntries(D.teams.map(t => [t.id, t]));
const PL = Object.fromEntries(D.players.map(p => [p.id, p]));
const gbp = v => '£' + v.toFixed(1) + 'm';
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const GW = D.meta.gws;
const DEF = {tab: 'home', h: D.meta.horizon, wo: D.weights.outlook, wp: D.weights.perf, wv: D.weights.value, pos: 0, pr: 15.5, team: 0, q: '', avail: false, diff: false, reg: true, sort: 'score', dir: -1, shown: 25, sqh: 5, btT: 'pts', ai: false, style: 'cons', pl: {}, plc: {}, lock: [], excl: [], cmp: [], pa: null, mt: 'lineup', view: 'sug', plan: [], auto: false, nf: 'rel'};
let S = JSON.parse(JSON.stringify(DEF));
try { Object.assign(S, JSON.parse(localStorage.getItem('fplboard5') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('fplboard5', JSON.stringify(S)); } catch (e) {} };
const open = new Set();

/* ---------- model helpers ---------- */
const horizonGW = () => GW.slice(0, S.h);
const xpOf = (p, h = S.h) => { const g = GW.slice(0, h); let s = 0; p.fx.forEach(f => { if (g.includes(f[0])) s += f[3] * adjM(p, f[0]); }); return s; };
const diffIdx = p => p.p <= 2 ? 14 : p.p === 3 ? 15 : 13;           // GK/DEF: defensive ease, MID: overall, FWD: attacking
function pctRank(vals, mask) {
  const el = vals.filter((v, i) => mask[i]).sort((a, b) => a - b), n = el.length;
  return vals.map((v, i) => { if (!mask[i] || n < 2) return mask[i] ? 50 : 0; let lo = 0, hi = n; while (lo < hi) { const m = (lo + hi) >> 1; if (el[m] < v) lo = m + 1; else hi = m; } return 100 * lo / (n - 1); });
}
let SC = {};
function computeScores() {
  SC = {};
  [1, 2, 3, 4].forEach(pt => {
    const g = D.players.filter(p => p.p === pt);
    const mask = g.map(p => p.pm1 >= 0.25 && p.fx.length > 0 && p.st !== 'u' && p.st !== 'n');
    const xp = g.map(p => xpOf(p)), val = g.map((p, i) => xp[i] / p.pr);
    const po = pctRank(xp, mask), pv = pctRank(val, mask);
    const ws = (S.wo + S.wp + S.wv) || 1;
    g.forEach((p, i) => { SC[p.id] = {xp: xp[i], val: val[i], po: po[i], pv: pv[i], reg: mask[i],
      score: mask[i] ? (S.wo * po[i] + S.wp * p.perf + S.wv * pv[i]) / ws : 0}; });
  });
}
function strip(p, n = S.h) {
  const gws = GW.slice(0, n), di = diffIdx(p);
  return '<div class="strip">' + gws.map(gw => {
    const fs = p.fx.filter(f => f[0] === gw);
    if (!fs.length) {
      const has = D.grid[p.t].some(f => f[0] === gw);
      return `<div class="fx blank">${has ? '·' : '–'}<small>GW${gw}</small></div>`;
    }
    return `<div class="fc">${fs.map(f => `<div class="fx d${f[di]}" title="${esc(TEAM[f[1]].name)} (${f[2] ? 'H' : 'A'}) · xPts ${f[3]} · xG for ${f[16]} / against ${f[17]}"><span>${esc(TEAM[f[1]].short)}</span><small>${f[2] ? 'H' : 'A'} · ${f[3].toFixed(1)}</small></div>`).join('')}</div>`;
  }).join('') + '</div>';
}
const newsTag = p => p.st === 'a' && !p.news ? '' : `<span class="tag ${p.st === 'u' || p.st === 'n' || p.chance === 0 ? 'bad' : 'warn'}" title="${esc(p.news)}">${p.chance == null ? (p.st === 'a' ? '' : p.st.toUpperCase()) : p.chance + '%'}${p.news ? ' ⚑' : ''}</span>`;

/* ---------- hover explanations ---------- */
const TIPS = {
  // header / tabs
  t_ov: 'Top 8 players per position by Score, with their next fixtures.',
  t_rk: 'Every modelled player: filter, sort and click a row to see where its projected points come from.',
  t_tm: 'Team strength fitted from results and xG, plus a fixture-difficulty grid.',
  t_sq: 'The best possible 15-man squad built from scratch (like a Wildcard) for the chosen horizon.',
  t_my: 'Your real squad on a pitch, lineup/captain suggestions, a transfer planner, and Free Hit / chip analysis.',
  t_nw: 'Public football headlines matched to players and teams: injuries, team news, transfers.',
  s_gw: 'The next gameweek that has not started yet. All projections are for this GW onwards.',
  s_players: 'Players with minutes this season (plus anyone owned by 0.5% or more) that the model projects.',
  s_matches: 'Finished Premier League matches used to fit the team attack/defence ratings.',
  s_updated: 'When this page was last rebuilt from the FPL API. Use the Update button to refresh.',
  // controls
  h: 'How many upcoming gameweeks the projections add up. 1 = next match only. Longer windows favour players with good runs of fixtures, shorter ones favour the next match.',
  wo: 'Weight of projected points (xPts) in the Score. xPts comes from the team-strength model combined with each player\'s goal, assist, clean-sheet, bonus and minutes rates and injury status.',
  wp: 'Weight of season performance in the Score: points per 90, xG+xA per 90, bonus and defensive contributions, ranked within position and shrunk toward average for players with few minutes. In the backtest this signal added little so far.',
  wv: 'Weight of value in the Score: projected points per £m, ranked within position. Rewards cheap players who project well.',

  // rankings columns
  c_price: 'Current price in £m.',

  // teams columns
  tm_form: 'Last six results, oldest to newest.',
  tm_wdl: 'Wins-draws-losses.',
  tm_gf: 'Goals for - goals against.',
  tm_xg: 'Expected goals created - expected goals conceded (from summed player xG). Better than goals at showing underlying strength.',
  tm_att: 'Attack rating relative to the league average: above 1 scores more than average. Fitted from results and xG.',
  tm_def: 'Defence rating relative to the league average: below 1 concedes less than average (lower is better).',
  tm_prior: 'Change in rank versus the preseason FPL-strength prior. The prior fades as matches are played.',
  // my team
  m_bank: 'Cash in the bank. You can spend it on transfers on top of what you get for players you sell.',
  m_value: 'Selling value of your 15 players (their prices after FPL\'s sell-price rule). Squad value plus bank is your total budget.',
  m_ft: 'Free transfers you still have this gameweek after any transfers you have already made. Each extra transfer costs 4 points. "~" means estimated from your public history; sync your team for the exact number.',
  m_lineup: 'Projected points of your current starting XI for the next gameweek, with the captain counted double.',
  m_form: 'Defenders-midfielders-forwards in your starting XI.',
  m_snap: 'When your logged-in FPL team data was captured. It does not update by itself: use Sync FPL team after you change your squad.',
  m_chip: 'Chips: Wildcard and Free Hit are transfer chips, Bench Boost and Triple Captain are team chips. The API marks when a chip\'s window expires.',
  m_sell: 'What you would actually get for this player. FPL sells at the buy price plus half of any price rise (rounded down), not the current price.',
  m_view: 'Current = your real lineup. Suggested = the best XI, formation and captain from your 15 for next GW. After plan = your squad with the planned transfers applied. Free Hit = the best possible squad for the chosen week.',
  p_gain: 'Extra projected points over the look-ahead window if this player replaces the one you sell, before any transfer cost.',
  p_net: 'Gain minus the 4-point hit when you have no free transfer left for it.',
  p_delta: 'Change in your best-XI projected points (captain counted double) over the look-ahead window, versus doing nothing.',
  p_hit: 'Points deducted: 4 for every planned transfer beyond your free transfers.',
  p_after: 'Bank left after selling the outgoing players at their selling price and buying the incoming ones at current price.',
  p_rules: 'A plan must fit the budget, keep at most 3 players per club and keep the squad composition (2 GKP, 5 DEF, 5 MID, 3 FWD).',
  chips: 'For each upcoming gameweek: your best XI, bench points (what Bench Boost would add), the captain\'s points (what Triple Captain would add), and what a Free Hit squad would score. Gain = Free Hit minus your own best XI. Blank/double counts are your squad members whose team has no / two matches that week.',
  ch_xi: 'Projected points of your best possible starting XI (from your current 15) that gameweek, without captain bonus.',

  ch_gain: 'Free Hit XI points minus your own best XI points. A big gain usually means you have blanks or a weak week; blank gameweeks make it larger.',
  ch_bd: 'Squad members whose team has no match that gameweek (blank) / two matches (double).',
  cap: 'Highest projected points in the next gameweek among your starting XI. The captain scores double.',
  tag_rot: 'Rotation risk: he played 60+ minutes in only a few of his last five matches.',
  tag_price: 'Price pressure estimate: net transfers in minus out this gameweek as a share of current owners. A heuristic, not FPL\'s real algorithm.',
  tag_news: 'FPL status / chance of playing. Hover the tag for the official news text.',
  news_kind: 'Keyword guess from the headline: injury/fitness, team news or tactics, transfer talk. It can be wrong, read the headline.',

};
const tip = k => `data-tip="${esc(TIPS[k] || k)}" tabindex="0"`;
const info = k => `<i class="info" ${tip(k)} aria-label="info">i</i>`;
(function () {
  const box = document.createElement('div'); box.id = 'tipbox'; box.setAttribute('role', 'tooltip'); document.body.appendChild(box);
  let cur = null;
  const hide = () => { cur = null; box.style.display = 'none'; };
  const show = el => {
    const txt = el.getAttribute('data-tip'); if (!txt) return; cur = el;
    box.textContent = txt; box.style.display = 'block';
    const r = el.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + 'px';
    box.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + 'px';
  };
  const at = e => e.target.closest ? e.target.closest('[data-tip]') : null;
  document.addEventListener('mouseover', e => { const el = at(e); if (el && el !== cur) show(el); else if (!el && cur) hide(); });
  document.addEventListener('focusin', e => { const el = at(e); if (el) show(el); });
  document.addEventListener('focusout', hide);
  document.addEventListener('scroll', hide, true);
  document.addEventListener('click', e => { const el = at(e); if (el && el === cur && matchMedia('(hover: none)').matches) hide(); else if (el && matchMedia('(hover: none)').matches) show(el); });
  window.hideTip = hide;
})();
/* ---------- extra player flags: suspension risk, rotation, price pressure ---------- */
const ycTag = p => {
  if (!p.ycleft) return '';
  const one = p.ycleft === 1;
  const txt = `${p.yc} yellow cards. ${one ? 'One more' : 'Two more'} brings a suspension: 5 yellows by the 19th league match = 1-match ban, 10 by the 32nd = 2 matches. `
    + (p.ban ? `Chance he is banned for at least one match in the next ${GW.length} gameweeks: ${Math.round(p.ban * 100)}%. ` : '')
    + 'That lost availability is already deducted from his projected points.';
  return `<span class="tag ${one ? 'bad' : 'warn'}" data-tip="${esc(txt)}" tabindex="0"><i class="yc"></i>${p.yc}${one && p.ban >= 0.05 ? ' · ' + Math.round(p.ban * 100) + '% ban' : ''}</span>`;
};
const rotTag = p => {
  const m = (p.histm || []).slice(-5);
  if (p.st !== 'a' || m.length < 4 || p.pm1 < 0.5) return '';
  const full = m.filter(v => v >= 60).length;
  if (full > m.length - 2) return '';
  return `<span class="tag warn" data-tip="${esc(`Rotation risk: played 60+ minutes in only ${full} of his last ${m.length} matches (minutes: ${m.join(', ')}). ` + TIPS.tag_rot)}" tabindex="0">ROT</span>`;
};
const priceTag = p => {
  if (Math.abs(p.tp) < 1) return '';
  const up = p.tp > 0;
  return `<span class="tag ${up ? 'good' : 'bad'}" data-tip="${esc(`Net transfers this gameweek: ${(p.tin - p.tout).toLocaleString()} (${p.tp > 0 ? '+' : ''}${p.tp}% of owners). ` + TIPS.tag_price)}" tabindex="0">${up ? '▲' : '▼'}</span>`;
};
const watchTag = p => {
  if (p.st !== 'a' || p.news) return '';
  const it = (NEWS_BY[p.id] || []).find(x => x.kind === 'health' && Date.now() / 1000 - x.ts < 72 * 3600);
  return it ? `<span class="tag warn" data-tip="${esc('Recent injury/fitness headline (FPL still shows him as available, so the projection is unchanged): ' + it.title + ' · ' + it.src)}" tabindex="0">📰</span>` : '';
};
const flags = p => [newsTag(p), ycTag(p), rotTag(p), priceTag(p), watchTag(p)].filter(Boolean).join(' ');

/* ---------- news ---------- */
const NEWS = (D.news && D.news.items) || [];
const NEWS_BY = {};
NEWS.forEach(it => it.ids.forEach(id => (NEWS_BY[id] = NEWS_BY[id] || []).push(it)));
const KIND = {health: ['Injury / fitness', 'bad'], teamnews: ['Team news', 'vio'], transfer: ['Transfers', ''], other: ['Other', '']};
const when = ts => ts ? new Date(ts * 1000).toLocaleString([], {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '';
const safeUrl = u => /^https?:\/\//.test(u) ? u : '#';
const newsLine = it => `<div class="nline"><div><a href="${esc(safeUrl(it.link))}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>
    <div class="nmeta"><span class="tag">${esc(it.src)}</span> <span class="tag ${KIND[it.kind][1]}" ${tip('news_kind')}>${KIND[it.kind][0]}</span>
    ${it.ids.map(id => PL[id] ? `<span class="tag ${OWNED.has(id) ? 'good' : ''}" ${tip('news_match')}>${esc(PL[id].n)}</span>` : '').join(' ')}
    ${it.tids.map(t => TEAM[t] ? `<span class="tm">${esc(TEAM[t].short)}</span>` : '').join('')}
    <span class="muted">${when(it.ts)}</span></div></div></div>`;
const OWNED = new Set(D.mine && !D.mine.error ? D.mine.picks.map(k => k.id) : []);
function playerNews(p, n = 3) {
  const l = (NEWS_BY[p.id] || []).slice(0, n);
  return l.length ? `<div class="note"><b>Headlines:</b>${l.map(it => `<div><a href="${esc(safeUrl(it.link))}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a> <span class="muted">${esc(it.src)}</span></div>`).join('')}</div>` : '';
}
function viewNews() {
  const N = D.news || {items: []};
  const f = S.nf || 'rel', cut = (S.nshown || 15);
  const relevant = it => it.kind !== 'other' || it.ids.length || it.src === 'FF Scout' || it.src === 'r/FantasyPL';
  const items = NEWS.filter(it => f === 'all' || (f === 'rel' ? relevant(it) : f === 'mine' ? it.ids.some(i => OWNED.has(i)) : it.kind === f));
  const tabs = [['rel', 'For FPL'], ['mine', 'My players'], ['health', 'Injury / fitness'], ['teamnews', 'Team news'], ['transfer', 'Transfers'], ['all', 'Everything']];
  const mineItems = NEWS.filter(it => it.ids.some(i => OWNED.has(i)) && (it.kind === 'health' || it.kind === 'teamnews')).slice(0, 6);
  const counts = {health: 0, teamnews: 0, transfer: 0};
  NEWS.forEach(it => { if (counts[it.kind] != null) counts[it.kind]++; });
  const side = `<div class="mside"><div class="card section"><h3 class="panel-title">Affecting your squad</h3>
      ${OWNED.size ? (mineItems.length ? mineItems.map(newsLine).join('') : '<div class="note" style="margin:0">No injury or team-news headlines about your players right now.</div>') : '<div class="note" style="margin:0">Add your team to see headlines about your players here.</div>'}</div>
    <div class="card section"><h3 class="panel-title">What is in the feed</h3><div class="mvline">Injury / fitness <b class="num" style="margin-left:auto">${counts.health}</b></div>

      <div class="note">${N.fetched ? 'Fetched ' + when(N.fetched) + '. ' : ''}Sources: ${esc((N.sources || []).join(' · ') || 'none')}${(N.errors || []).length ? ' · unavailable: ' + esc(N.errors.join('; ')) : ''}. Headlines and links only; women\'s football and other sports are filtered out. Matching is by name (green = in your squad). These headlines are not fed into the projections: only the official FPL status and chance of playing are.</div></div></div>`;
  return `<div class="posbar">${tabs.map(([v, l]) => `<button class="pill ${f === v ? 'on' : ''}" data-nf="${v}">${l}</button>`).join('')}<span class="tag" style="align-self:center">${items.length} headlines</span></div>

function rowHTML(p, i) {
  const s = SC[p.id], isOpen = open.has(p.id);
  let h = `<tr class="row" data-id="${p.id}"><td class="rk num">${i}</td>

  if (isOpen) h += detailRow(p);

}
const COMP = [['Appearance', 4, '#8c98c0'], ['Goals', 5, '#2bd48e'], ['Assists', 6, '#4da3ff'], ['Clean sheet', 7, '#b06cff'], ['Goals conceded', 8, '#ff5d73'],
  ['Saves', 9, '#ffd24a'], ['Bonus', 10, '#ff9a4d'], ['Def. contribution', 11, '#00c2c7'], ['Cards', 12, '#ff7aa2']];
function detailRow(p) {
  const g = GW.slice(0, S.h), fx = p.fx.filter(f => g.includes(f[0]));
  const sums = COMP.map(c => fx.reduce((a, f) => a + f[c[1]], 0)), tot = sums.reduce((a, b) => a + Math.max(0, b), 0) || 1;
  const maxPts = Math.max(8, ...p.hist);
  return `<tr class="xrow"><td colspan="13"><div class="xgrid">
    <div><h4 class="panel-title">Where the ${f1(xpOf(p))} projected points come from (next ${S.h} GW)</h4>
      <div class="stack">${COMP.map((c, k) => sums[k] > 0 ? `<i style="width:${100 * sums[k] / tot}%;background:${c[2]}" title="${c[0]} ${f1(sums[k])}"></i>` : '').join('')}</div>
      <div class="leg">${COMP.map((c, k) => `<span style="--c:${c[2]}">${c[0]} <b class="num">${sums[k] >= 0 ? '+' : ''}${f1(sums[k])}</b></span>`).join('')}</div>
      <h4 class="panel-title" style="margin-top:18px">Last ${p.hist.length} gameweeks (points)</h4>
      <div class="spark">${p.hist.map((v, k) => `<i class="${p.histm[k] === 0 ? 'z' : ''}" style="height:${Math.max(2, 56 * Math.max(0, v) / maxPts)}px" title="${v} pts · ${p.histm[k]}'"></i>`).join('')}</div>
      <div class="note">Grey = didn't play. Minutes reliability: plays ${Math.round(p.pm1 * 100)}% of matches, 60+ in ${Math.round(p.p60 * 100)}%.</div></div>

const AIA = {};
((D.ai && D.ai.adjustments) || []).forEach(a => AIA[a.id] = a);
const adjM = (p, gw) => (S.ai && AIA[p.id] && gw <= AIA[p.id].until) ? AIA[p.id].mult : 1;
const DEFBW = [0.03, 0.12, 0.08, 0.04];
const bwOf = () => (Array.isArray(S.bw) && S.bw.length === 4 ? S.bw : DEFBW);
const lockSet = () => new Set(S.lock || []), exclSet = () => new Set(S.excl || []);

const confLabel = net => Math.abs(net) < NOISE ? `<span class="tag warn" data-tip="${esc('Projection error is about 2 points per player per gameweek (backtest), so a gain this small is not distinguishable from luck.')}" tabindex="0">within noise</span>` : `<span class="tag good" data-tip="${esc('Larger than the typical projection error, but still a projection, not a guarantee.')}" tabindex="0">clear on paper</span>`;

/* squad value for one gameweek: best XI + captain bonus + weighted bench */
function squadValue(players, g, chip) {
  const b = bestXI(players, g); if (!b) return 0;
  const bw = bwOf(), gkB = b.bench.filter(p => p.p === 1), outB = b.bench.filter(p => p.p !== 1);
  const benchXp = (gkB[0] ? bw[0] * xpG(gkB[0], g) : 0) + outB.slice(0, 3).reduce((a, p, i) => a + bw[i + 1] * xpG(p, g), 0);

  return b.tot + b.capXp * (chip === '3xc' ? 2 : 1) + benchXp;

/* multi-gameweek simulation: squad carries forward, free transfers roll (max 5), chips applied */
function simulate(m, K, pl, plc, ft0, gws) {
  const fh = m.fh || {};
  let squad = K.map(x => x.p), bank = m.bank, ft = ft0, total = 0, hits = 0;
  const buy = {}; K.forEach(x => buy[x.p.id] = x.k.sell != null ? x.k.sell : x.p.pr);
  const out = [];
  gws.forEach(g => {
    const chip = plc[g] || '', moves = pl[g] || [], r = {g, chip, ft, hit: 0, issues: [], moves};
    if (chip === 'freehit') {
      const f = fh[String(g)], sq = f && !f.error ? f.squad.map(id => PL[id]).filter(Boolean) : squad;
      r.value = squadValue(sq, g); r.sq = squad; r.bank = bank; r.buy = {...buy};
    } else {
      const sq = squad.slice(); let bk = bank;
      moves.forEach(([o, i]) => {
        const idx = sq.findIndex(p => p.id === o);
        if (idx < 0 || !PL[i] || PL[i].p !== sq[idx].p) { r.issues.push('Invalid move'); return; }
        bk += (buy[o] != null ? buy[o] : sq[idx].pr) - PL[i].pr; buy[i] = PL[i].pr; sq[idx] = PL[i];
      });
      const cnt = {}; sq.forEach(p => cnt[p.t] = (cnt[p.t] || 0) + 1);
      Object.entries(cnt).forEach(([t, n]) => { if (n > 3) r.issues.push(`${n} players from ${TEAM[t].short}`); });
      if (bk < -0.001) r.issues.push(`Over budget by £${(-bk).toFixed(1)}m`);
      if (new Set(sq.map(p => p.id)).size !== sq.length) r.issues.push('Duplicate player');
      r.hit = chip === 'wildcard' ? 0 : 4 * Math.max(0, moves.length - ft);
      squad = sq; bank = bk; r.sq = sq; r.bank = bk; r.buy = {...buy};
      r.value = squadValue(sq, g, chip === 'bboost' || chip === '3xc' ? chip : '');
    }
    const used = chip === 'freehit' || chip === 'wildcard' ? 0 : moves.length;
    ft = Math.min(5, Math.max(0, ft - used) + 1);

}
const PLAN_GWS = () => GW.slice(0, Math.min(6, GW.length));
function planCands(r, outId, g, gws) {
  const o = r.sq.find(p => p.id === outId); if (!o) return [];
  const held = new Set(r.sq.map(p => p.id)), ex = exclSet(), cnt = {};
  r.sq.forEach(p => cnt[p.t] = (cnt[p.t] || 0) + 1);
  const cap = (r.buy[o.id] != null ? r.buy[o.id] : o.pr) + r.bank;
  const span = gws.filter(x => x >= g);
  const val = p => span.reduce((a, x) => a + xpG(p, x), 0);
  return D.players.filter(q => q.p === o.p && !held.has(q.id) && !ex.has(q.id) && q.pr <= cap + 1e-9 && (q.st === 'a' || q.st === 'd') && SC[q.id] && SC[q.id].reg
      && ((cnt[q.t] || 0) - (q.t === o.t ? 1 : 0) < 3)).map(q => ({q, v: val(q) - val(o)})).sort((a, b) => b.v - a.v);

        <div class="note">Each set is refitted for every finished gameweek using only earlier data, then scored on what followed. One season and ${B.gws[1]} gameweeks: the best of ${B.n_sets.toLocaleString()} sets is flattered by being picked on the same data, so treat a tie as a tie. Points start at GW${B.pgws[0]} (the player model needs history). Goal difference, xG and likelihood do not depend on the Score mix, so those views list distinct team-model sets. xG-heavy sets are partly judged on the quantity they fit.</div></div>

        <table class="mt"><tbody><tr><td>xG share</td><td class="r num">${g.xg_weight.map(v => Math.round(v * 100) + '%').join(' · ')}</td></tr><tr><td>Half-life (GWs)</td><td class="r num">${g.half_life_gw.join(' · ')}</td></tr><tr><td>Prior strength</td><td class="r num">${g.prior_strength.join(' · ')}</td></tr><tr><td>Prior scale</td><td class="r num">${g.prior_scale.map(v => v.toFixed(2)).join(' · ')}</td></tr><tr><td>Score mix</td><td class="r num">${B.n_mix} (steps of 5)</td></tr></tbody></table></div>
      ${B0 ? `<div class="card section"><h3 class="panel-title">Projection accuracy by position ${info('bt_acc')}</h3>
        <table class="mt"><thead><tr><th></th><th class="r">Model</th><th class="r">Form</th><th class="r">Season avg</th><th class="r">Error (pts)</th></tr></thead><tbody>
        ${acc.map(([nm, a]) => `<tr><td>${nm}</td><td class="r num ${a.rho >= a.rho_form && a.rho >= a.rho_avg ? 'cmpbest' : ''}">${a.rho.toFixed(2)}</td><td class="r num">${a.rho_form.toFixed(2)}</td><td class="r num">${a.rho_avg.toFixed(2)}</td><td class="r num">${a.mae.toFixed(1)}</td></tr>`).join('')}</tbody></table>
        <div class="note">Rank correlation with what players actually scored the next gameweek (higher is better), against two naive baselines, at your active set. Error = mean absolute error of projected vs actual points. Bias ${B0.bias >= 0 ? '+' : ''}${B0.bias} pts per player.</div></div>
      <div class="card section"><h3 class="panel-title">Accuracy by gameweek ${info('bt_gw')}</h3>
        <div class="hbars">${B0.per_gw.map(g => `<div class="hb" title="GW${g.gw}: rank correlation ${g.rho}"><i style="height:${Math.max(2, Math.round(Math.max(0, g.rho) / mxr * 70))}px"></i><b class="num">${g.rho.toFixed(2)}</b><small>${g.gw}</small></div>`).join('')}</div></div>` : ''}</div></div>`;
}
function autoRow() {
  const A = D.auto; if (!A) return '';
  const ok = location.protocol.startsWith('http');
  const note = A.on ? (A.gw ? `Last picked after GW${A.gw}${A.changed ? '' : ' (no change)'}. It picks again once the next gameweek has finished.` : 'It will pick the best set at the next update.')
                    : 'Off: your own choice is kept. Turn on to adopt the best now and after each gameweek.';
  return `<div class="mvline" style="margin-top:8px"><button class="pill ${A.on ? 'on' : ''}" data-auto="1" ${tip('auto_pick')} ${ok ? '' : 'disabled'}>Auto-pick best set: ${A.on ? 'on' : 'off'}</button><button class="plan" data-autonow="1" ${tip('auto_now')} ${ok ? '' : 'disabled'}>Pick best now</button><span class="muted" id="auto-st"> ${note}</span></div>`;
}
async function postJson(url, hdr, body, st, done) {
  if (st) st.textContent = ' Saving…';
  try {
    const r = await fetch(url, {method: 'POST', headers: {'X-Requested-With': hdr, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (r.status === 403 || r.status === 404) throw new Error('the local server is running old code: close its window and start start.bat again');
    if (!r.ok) throw new Error((await r.json()).error || 'server said ' + r.status);
    if (st) st.textContent = done; setTimeout(() => location.reload(), 3500);
  } catch (e) { if (st) st.textContent = ' Could not save: ' + e.message; document.querySelectorAll('[data-usetm],[data-auto],[data-autonow],#savew').forEach(b => b.disabled = false); }
}
const lockBtns = () => document.querySelectorAll('[data-usetm],[data-auto],[data-autonow],#savew').forEach(b => b.disabled = true);
function setAuto(on, now) { lockBtns(); postJson('/api/autopick', 'autopick-button', now ? {now: true} : {on}, $('#auto-st'), ' Saved. Rebuilding…'); }
function saveModelSet(x) { lockBtns(); postJson('/api/modelset', 'modelset-button', Object.fromEntries(WS_NAMES.map((k, i) => [k, x[i]])), $('#tmst'), ' Saved. Rebuilding with the new set…'); }
function saveWeights() { lockBtns(); postJson('/api/weights', 'weights-button', {wo: S.wo, wp: S.wp, wv: S.wv}, $('#savewst'), ' Saved as default. Rebuilding…'); }

function render() {
  if (!['home', 'my', 'rk', 'tm', 'cmp', 'wt', 'nw', 'sq', 'md'].includes(S.tab)) S.tab = 'home';
  computeScores();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  $('#controls').querySelectorAll('.rk-only').forEach(e => e.classList.toggle('hide', S.tab !== 'rk'));
  $('#controls').querySelectorAll('.w-only').forEach(e => e.classList.toggle('hide', S.tab !== 'rk'));
  $('#controls').classList.toggle('hide', S.tab !== 'rk');
  if (window.hideTip) hideTip();
  $('#wo').value = S.wo; $('#wp').value = S.wp; $('#wv').value = S.wv; $('#pr').value = S.pr;
  $('#lah').classList.toggle('hide', !['home', 'my', 'rk', 'cmp', 'wt'].includes(S.tab)); $('#hsel').value = S.h;
  $('#v-wo').textContent = S.wo; $('#v-wp').textContent = S.wp; $('#v-wv').textContent = S.wv;
  $('#v-pr').textContent = gbp(+S.pr);
  $('#view').innerHTML = {home: viewHome, rk: viewRankings, tm: viewTeams, cmp: viewCompare, wt: viewWatch, sq: viewSquad, my: viewMine, nw: viewNews, md: viewModel}[S.tab]();
  bind(); save();
}
function bind() {
  document.querySelectorAll('tr.row').forEach(r => r.onclick = () => { const id = +r.dataset.id; open.has(id) ? open.delete(id) : open.add(id); render(); });
  document.querySelectorAll('[data-pos]').forEach(b => b.onclick = () => { S.pos = +b.dataset.pos; S.shown = 25; render(); });
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { S.sel = +b.dataset.pick; if (S.tab === 'my' && (S.mt || 'lineup') === 'lineup') S.mt = 'transfers'; render(); });
  document.querySelectorAll('[data-tk]').forEach(el => el.onchange = () => { const k = el.dataset.tk, v = el.value;
    if (k === 'mode') S.tkMode = v; else if (k === 'sort') S.tkSort = v; else if (k === 'from') { const to0 = S.tkTo || GW[Math.min(4, GW.length - 1)]; S.tkFrom = +v; S.tkTo = Math.max(to0, +v + Math.min(4, GW.length - 1 - GW.indexOf(+v))); } else if (k === 'to') S.tkTo = +v; render(); });
  document.querySelectorAll('[data-cmp]').forEach(el => el.onchange = () => { S.cmp = [...document.querySelectorAll('[data-cmp]')].map(x => +x.value).filter(Boolean); render(); });
  const sw = $('#savew'); if (sw) sw.onclick = saveWeights;
  document.querySelectorAll('[data-tmt]').forEach(b => b.onclick = () => { S.tmT = b.dataset.tmt; render(); });
  document.querySelectorAll('[data-usetm]').forEach(b => b.onclick = () => saveModelSet(b.dataset.usetm.split(',').map(Number)));
  document.querySelectorAll('[data-auto]').forEach(b => b.onclick = () => setAuto(!(D.auto || {}).on));
  document.querySelectorAll('[data-autonow]').forEach(b => b.onclick = () => setAuto(true, true));
  document.querySelectorAll('[data-style]').forEach(b => b.onclick = () => { S.style = b.dataset.style; render(); });
  document.querySelectorAll('[data-bw]').forEach(r => r.onchange = () => { const bw = [...bwOf()]; bw[+r.dataset.bw] = +r.value / 100; S.bw = bw; render(); });
  const tg = (key, id) => { const t = new Set(S[key] || []); t.has(id) ? t.delete(id) : t.add(id); S[key] = [...t]; };
  document.querySelectorAll('[data-lock]').forEach(b => b.onclick = e => { e.stopPropagation(); tg('lock', +b.dataset.lock); render(); });
  document.querySelectorAll('[data-excl]').forEach(b => b.onclick = e => { e.stopPropagation(); tg('excl', +b.dataset.excl); render(); });
  document.querySelectorAll('[data-pchip]').forEach(el => el.onchange = () => { S.plc = S.plc || {}; if (el.value) S.plc[el.dataset.pchip] = el.value; else delete S.plc[el.dataset.pchip]; render(); });
  document.querySelectorAll('[data-pout]').forEach(el => el.onchange = () => { S.pa = el.value ? {g: +el.dataset.pout, out: +el.value} : null; render(); });
  document.querySelectorAll('[data-pin]').forEach(el => el.onchange = () => { if (!el.value || !S.pa) return; const g = +el.dataset.pin; S.pl = S.pl || {}; S.pl[g] = [...(S.pl[g] || []), [S.pa.out, +el.value]]; S.pa = null; render(); });
  document.querySelectorAll('[data-punplan]').forEach(b => b.onclick = () => { const [g, k] = b.dataset.punplan.split(',').map(Number); S.pl[g].splice(k, 1); if (!S.pl[g].length) delete S.pl[g]; render(); });
  document.querySelectorAll('[data-suggest]').forEach(b => b.onclick = () => { const c = myCtx(); if (c) { S.pl = suggestPlan(c.m, c.K, c.ft, S.style || 'cons'); S.pa = null; } render(); });
  document.querySelectorAll('[data-clearpl]').forEach(b => b.onclick = () => { S.pl = {}; S.pa = null; render(); });
  document.querySelectorAll('[data-gotoai]').forEach(a => a.onclick = e => { e.preventDefault(); S.tab = 'my'; S.mt = 'ai'; render(); });
  const ra2 = $('#runai'); if (ra2) ra2.onclick = runAI;
  const ap = $('#aiapply'); if (ap) ap.onchange = () => { S.ai = ap.checked; render(); };
  tickCountdown();
  document.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => { S.mt = b.dataset.mt; render(); });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; render(); });
  document.querySelectorAll('[data-fhgw]').forEach(b => b.onclick = () => { S.fhgw = +b.dataset.fhgw; render(); });
  document.querySelectorAll('[data-nf]').forEach(b => b.onclick = () => { S.nf = b.dataset.nf; render(); });
  document.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => {
    const [o, i] = b.dataset.plan.split(',').map(Number); S.plan = (S.plan || []).filter(e => e[0] !== o);
    if (!b.classList.contains('on')) S.plan.push([o, i]); S.view = 'plan'; render(); });
  document.querySelectorAll('[data-unplan]').forEach(b => b.onclick = () => { S.plan.splice(+b.dataset.unplan, 1); render(); });
  document.querySelectorAll('[data-load]').forEach(b => b.onclick = () => { S.plan = JSON.parse(b.dataset.load); S.view = 'plan'; render(); });
  const cp = $('#clearplan'); if (cp) cp.onclick = () => { S.plan = []; render(); };
  const mn = $('#morenews'); if (mn) mn.onclick = () => { S.nshown = (S.nshown || 15) + 15; render(); };
  document.querySelectorAll('[data-nf]').forEach(b => b.addEventListener('click', () => { S.nshown = 15; }));
  const ra = $('#runauto'); if (ra) ra.onclick = () => { S.auto = true; render(); };
  document.querySelectorAll('[data-sqh]').forEach(b => b.onclick = () => { S.sqh = +b.dataset.sqh; render(); });
  document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => { const k = th.dataset.sort; if (S.sort === k) S.dir *= -1; else { S.sort = k; S.dir = k === 'pr' ? 1 : -1; } render(); });
  const more = $('#more'); if (more) more.onclick = () => { S.shown += 25; render(); };
}
function init() {
  $('#sub').textContent = `Season ${D.meta.season}/${String((+D.meta.season + 1) % 100).padStart(2, '0')} · after GW${D.meta.gw_now} · next GW${D.meta.gw_next}`;
  $('#stats').innerHTML = [['Next gameweek', 'GW' + D.meta.gw_next, 's_gw'], ['Players modelled', D.meta.n_players, 's_players'], ['Matches in model', D.meta.n_matches, 's_matches'], ['Updated', D.meta.generated, 's_updated']]
    .map(([k, v, t]) => `<div class="stat" ${tip(t)}><b class="num">${esc(v)}</b><span>${k}</span></div>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => { b.setAttribute('data-tip', TIPS['t_' + b.dataset.t]); });
  $('#foot').textContent = 'Data: official FPL API · model: Poisson attack/defence ratings from results + xG with FPL strength as a fading prior; expected points from shrunk per-90 rates, minutes & availability. Projections, not guarantees.';
  $('#team').innerHTML = '<option value="0">All teams</option>' + [...D.teams].sort((a, b) => a.name.localeCompare(b.name)).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  $('#team').value = S.team; $('#q').value = S.q; $('#avail').checked = S.avail; $('#diff').checked = S.diff; $('#reg').checked = S.reg;
  [['wo', 'wo'], ['wp', 'wp'], ['wv', 'wv'], ['pr', 'pr']].forEach(([id, k]) => $('#' + id).oninput = e => { S[k] = +e.target.value; render(); });
  $('#team').onchange = e => { S.team = +e.target.value; render(); };
  $('#q').oninput = e => { S.q = e.target.value; render(); $('#q').focus(); };
  [['avail', 'avail'], ['diff', 'diff'], ['reg', 'reg']].forEach(([id, k]) => $('#' + id).onchange = e => { S[k] = e.target.checked; render(); });
  $('#hsel').innerHTML = GW.map((g, i) => `<option value="${i + 1}">${i + 1} GW (${GW[0]}${i ? '–' + g : ''})</option>`).join('');
  $('#hsel').onchange = e => { S.h = +e.target.value; render(); };
  $('#lah').setAttribute('data-tip', TIPS.h);
  ['wo', 'wp', 'wv', 'pr', 'avail', 'diff', 'reg'].forEach(k => { const e = $('#tl-' + k); e.setAttribute('data-tip', TIPS[k]); e.setAttribute('tabindex', '0'); });
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); });
  $('#theme').onclick = () => { const r = document.documentElement; const dark = getComputedStyle(r).getPropertyValue('--bg').trim() === '#0b0b1a'; r.dataset.theme = dark ? 'light' : 'dark'; };
  render();
  setInterval(tickCountdown, 30000);
}
init();
</script>
<style>
#upd{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font:13px/1.35 system-ui,sans-serif}
#upd .row{display:flex;gap:8px;align-items:center}
#upd button{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:800;font-size:13px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink,#fff);box-shadow:0 8px 24px rgba(0,0,0,.35)}
#upd button.alt{background:var(--violet);color:#fff}
#upd button:disabled{opacity:.7;cursor:progress}
#upd .spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:upd-r .8s linear infinite;display:none}
#upd button.busy .spin{display:inline-block}
@keyframes upd-r{to{transform:rotate(360deg)}}
#upd .msg{max-width:360px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none}
#upd .msg.show{display:block}
#upd .msg.err{border-color:var(--red);color:var(--red)}
#upd .msg small{display:block;color:var(--muted);margin-top:2px}
@media(max-width:560px){#upd{left:12px;right:12px;align-items:stretch}#upd .row{justify-content:flex-end}}
</style>
<div id="upd" hidden><div class="msg" id="upd-msg"></div>
  <div class="row"><button id="ai-btn" class="alt" type="button" title="Runs the Claude Code skill fpl-ai-insights: reads the news and your squad, writes a structured report (about 25 s)"><span class="spin"></span><span id="ai-lbl">AI analysis</span></button>
  <button id="upd-btn" type="button" title="Fetch the latest FPL data and rebuild this page"><span class="spin"></span><span id="upd-lbl">Update data</span></button></div></div>
<script>
(function(){
  const box=document.getElementById('upd'), btn=document.getElementById('upd-btn'), aib=document.getElementById('ai-btn'), msg=document.getElementById('upd-msg'),
        lbl=document.getElementById('upd-lbl'), ail=document.getElementById('ai-lbl');
  if(location.protocol!=='http:'){ return; }                       // opened as a plain file: no server behind it
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const show=(t,cls,sub)=>{msg.className='msg show'+(cls?' '+cls:'');msg.innerHTML=t+(sub?'<small>'+sub+'</small>':'');};
  const idle=()=>{ btn.disabled=aib.disabled=false; btn.classList.remove('busy'); aib.classList.remove('busy'); lbl.textContent='Update data'; ail.textContent='AI analysis'; };
  const busy=which=>{ btn.disabled=aib.disabled=true; (which==='ai'?aib:btn).classList.add('busy'); if(which==='ai') ail.textContent='Analysing...'; else lbl.textContent='Updating...'; };
  const get=async p=>{ try{ const r=await fetch(p,{cache:'no-store'}); return r.ok?await r.json():null; }catch(e){ return null; } };
  async function pollUpdate(){
    for(;;){ const s=await get('/api/status'); if(!s){ show('Lost connection to the local server','err'); idle(); return; }
      if(s.running){ busy('upd'); show('Updating...','', (s.log[s.log.length-1]||'')); await sleep(1200); continue; }
      idle();
      if(s.ok===false){ show('Update failed: '+s.message,'err'); }
      else { show('Done: '+s.message,'','Reloading...'); setTimeout(()=>location.reload(),900); }
      return; }
  }
  async function pollAI(t0){
    for(;;){ const s=await get('/api/ai/status'); if(!s){ show('Lost connection to the local server','err'); idle(); return; }
      const sec=Math.round((Date.now()-t0)/1000);
      if(s.running){ busy('ai'); show('AI analysis running... '+sec+'s','','Reading the news and your squad. Usually about 25 s.'); const st=document.getElementById('aistatus'); if(st) st.textContent='Running... '+sec+'s'; await sleep(2000); continue; }
      if(!s.ok){ idle(); show('AI analysis failed: '+(s.message||'unknown error'),'err'); return; }
      show('AI analysis done in '+s.seconds+'s'+(s.cost_usd?' ($'+s.cost_usd.toFixed(2)+')':''),'','Rebuilding the page...'); busy('upd'); await sleep(1500); return pollUpdate(); }
  }
  async function runAI(){
    if(aib.disabled) return; busy('ai'); show('Starting AI analysis...');
    try{ const r=await fetch('/api/ai',{method:'POST',headers:{'X-Requested-With':'ai-button'}});
      if(r.status===403||r.status===404) throw new Error('the local server is running old code: close its window and start start.bat again');
      if(!r.ok && r.status!==409) throw new Error('server said '+r.status);
      pollAI(Date.now()); }
    catch(e){ idle(); show('Could not start the AI analysis: '+e.message,'err'); } }
  window.fplRunAI=runAI;
  btn.onclick=async()=>{ busy('upd'); show('Starting update...');
    try{ const r=await fetch('/api/refresh',{method:'POST',headers:{'X-Requested-With':'update-button'}});
      if(!r.ok && r.status!==409){ throw new Error('server said '+r.status); } pollUpdate(); }
    catch(e){ idle(); show('Could not start the update: '+e.message,'err'); } };
  aib.onclick=runAI;
  get('/api/status').then(async s=>{ if(!s) return; box.hidden=false; const a=await get('/api/ai/status');
    if(a&&a.running){ pollAI(Date.now()); }
    else if(s.running){ busy('upd'); pollUpdate(); }
    else if(s.built_at){ show('Last build: '+s.built_at); setTimeout(()=>{ if(!msg.classList.contains('err')) msg.classList.remove('show'); },3500); } });
})();
</script>
